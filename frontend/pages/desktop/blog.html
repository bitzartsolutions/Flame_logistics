<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Insights | Flame Logistics</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Unified Tailwind Config -->
  <script src="/assets/js/tailwind.config.js"></script>
  
  <!-- Common Styles -->
  <link rel="stylesheet" href="/assets/css/main.css">
  
  <!-- Page-specific Styles -->
  <link rel="stylesheet" href="/assets/css/pages/blog.css">
</head>
<body class="bg-background text-on-surface font-body-md">
  
  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>
  
  <main class="pt-20">
    <!-- Hero Section -->
    <section class="py-24 bg-primary text-white">
      <div class="max-w-[1280px] mx-auto px-[40px]">
        <div class="max-w-3xl reveal">
          <span class="inline-block px-4 py-1.5 bg-secondary/20 text-secondary rounded-full font-label-md uppercase tracking-widest mb-6">Industry Insights</span>
          <h1 class="font-display-lg text-display-lg mb-6">Trade Insights & News</h1>
          <p class="font-body-lg text-body-lg text-white/80">Stay informed with the latest trends, analysis, and updates from the GCC logistics industry.</p>
        </div>
      </div>
    </section>

    <section class="py-24 bg-surface">
      <div class="max-w-[1280px] mx-auto px-[40px]">
        <div id="featuredBlog" class="mb-10"></div>
        <div id="blogPostsGrid" class="grid gap-8 md:grid-cols-2"></div>
      </div>
    </section>

    <!-- Newsletter CTA -->
    <section class="py-24 bg-primary text-white">
      <div class="max-w-[1280px] mx-auto px-[40px] text-center reveal">
        <h2 class="font-headline-md text-headline-md mb-4">Stay Ahead of the Curve</h2>
        <p class="font-body-lg text-body-lg text-white/80 mb-8 max-w-2xl mx-auto">Subscribe to our newsletter for exclusive industry insights, market analysis, and logistics innovations delivered to your inbox.</p>
        <form class="flex flex-col sm:flex-row gap-4 justify-center max-w-xl mx-auto">
          <input class="flex-1 px-6 py-4 rounded-xl text-on-surface border-0 focus:ring-2 focus:ring-secondary" placeholder="Enter your email" type="email">
          <button class="bg-secondary text-white px-8 py-4 rounded-xl font-bold hover:bg-on-secondary-fixed-variant transition-colors" type="submit">
            Subscribe
          </button>
        </form>
      </div>
    </section>
  </main>
  
  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>
  
  <!-- Common Scripts -->
  <script src="/assets/js/main.js"></script>
  <script>
    const BLOG_API_BASE = window.location.port === '3000' ? 'http://localhost:4000' : window.location.origin;
    const featuredBlog = document.getElementById('featuredBlog');
    const blogPostsGrid = document.getElementById('blogPostsGrid');

    function formatDate(dateString) {
      if (!dateString) return 'Recent';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
    }

    function renderFeatured(post) {
      if (!post) {
        featuredBlog.innerHTML = `
          <div class="rounded-3xl border border-dashed border-outline-variant/40 bg-white p-12 text-center reveal">
            <h2 class="font-headline-md text-headline-md text-primary mb-4">No articles published yet</h2>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">The latest insights will appear here once content is added from the admin panel.</p>
          </div>
        `;
        return;
      }

      featuredBlog.innerHTML = `
        <article class="overflow-hidden rounded-3xl border border-outline-variant/30 bg-white shadow-sm">
          <div class="grid md:grid-cols-[1.1fr_0.9fr]">
            <div class="h-80 md:h-full">
              <img src="${post.imageUrl}" alt="${post.title}" class="h-full w-full object-cover" onerror="this.src='https://via.placeholder.com/800x500?text=Image+Unavailable'">
            </div>
            <div class="p-8 md:p-10 flex flex-col justify-center">
              <span class="inline-flex w-fit rounded-full bg-secondary/10 px-3 py-1 text-sm font-semibold uppercase tracking-widest text-secondary mb-4">Featured Insight</span>
              <h2 class="font-headline-md text-headline-md text-primary mb-4">${post.title}</h2>
              <p class="font-body-lg text-body-lg text-on-surface-variant mb-6">${post.excerpt}</p>
              <div class="flex flex-wrap items-center gap-3 text-sm text-on-surface-variant">
                <span>${post.category || 'logistics'}</span>
                <span>•</span>
                <span>${formatDate(post.date)}</span>
                <span>•</span>
                <span>${post.readTime || '5 min read'}</span>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function renderPosts(posts) {
      if (!posts.length) {
        blogPostsGrid.innerHTML = `
          <div class="md:col-span-2 rounded-3xl border border-dashed border-outline-variant/30 bg-surface p-12 text-center reveal">
            <h3 class="font-headline-md text-headline-md text-primary mb-3">Blog feed is currently empty</h3>
            <p class="font-body-lg text-body-lg text-on-surface-variant">Check back soon for new posts and updates.</p>
          </div>
        `;
        return;
      }

      blogPostsGrid.innerHTML = posts.map(post => `
        <article class="rounded-3xl border border-outline-variant/30 bg-white p-6 shadow-sm">
          <img src="${post.imageUrl}" alt="${post.title}" class="mb-6 h-48 w-full rounded-2xl object-cover" onerror="this.src='https://via.placeholder.com/800x500?text=Image+Unavailable'">
          <div class="flex items-center gap-2 text-sm text-on-surface-variant mb-3">
            <span class="font-semibold uppercase tracking-widest text-primary">${post.category || 'logistics'}</span>
            <span>•</span>
            <span>${formatDate(post.date)}</span>
          </div>
          <h3 class="font-headline-md text-headline-md text-primary mb-3">${post.title}</h3>
          <p class="font-body-lg text-body-lg text-on-surface-variant">${post.excerpt}</p>
        </article>
      `).join('');
    }

    async function loadBlogPosts() {
      try {
        const response = await fetch(`${BLOG_API_BASE}/api/blog`);
        if (!response.ok) throw new Error('Failed to load blog posts');
        const data = await response.json();
        const items = Array.isArray(data.items) ? data.items : [];
        const featured = data.featured || items[0] || null;
        const feedPosts = featured ? items.filter((post) => post.id !== featured.id) : items;
        renderFeatured(featured);
        renderPosts(feedPosts);
      } catch (error) {
        featuredBlog.innerHTML = `
          <div class="rounded-3xl border border-dashed border-outline-variant/40 bg-white p-12 text-center reveal">
            <h2 class="font-headline-md text-headline-md text-primary mb-4">Unable to load articles</h2>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Please check that the backend server is running.</p>
          </div>
        `;
        blogPostsGrid.innerHTML = '';
      }
    }

    loadBlogPosts();
  </script>
</body>
</html>
