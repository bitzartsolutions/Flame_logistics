<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Article | Flame Logistics</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#000000',
            secondary: '#bc000c',
            background: '#fcf8ff',
            surface: '#fcf8ff',
            'on-surface': '#1b1b20',
            'on-surface-variant': '#464651',
            outline: '#777682',
            'outline-variant': '#c7c5d3'
          },
          fontFamily: {
            'headline-md': ['Plus Jakarta Sans'],
            'body-md': ['Inter']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background text-on-surface font-body-md antialiased">
  <div id="header-placeholder"></div>

  <main class="pt-[80px] pb-24 px-margin-mobile">
    <div class="mb-6">
      <a id="back-to-blog" href="blog.html" class="inline-flex items-center gap-2 text-sm font-semibold text-primary hover:text-secondary transition-colors">
        <span class="material-symbols-outlined">arrow_back</span>
        Back to insights
      </a>
    </div>

    <div id="article-loading" class="rounded-2xl border border-outline-variant/30 bg-white p-8 text-center">
      <p class="text-body-md text-on-surface-variant">Loading article...</p>
    </div>

    <div id="article-error" class="hidden"></div>

    <article id="article-content-wrapper" class="hidden">
      <img id="article-hero-image" class="h-56 w-full rounded-2xl object-cover" alt="Article hero" />
      <div class="mt-5">
        <div id="article-meta" class="mb-3 flex flex-wrap items-center gap-2"></div>
        <h1 id="article-title" class="font-headline-md text-primary text-[28px] leading-tight"></h1>
        <p id="article-excerpt" class="mt-4 text-body-md text-on-surface-variant"></p>
        <div id="article-content" class="mt-6 space-y-5"></div>
      </div>
    </article>
  </main>

  <div id="footer-placeholder"></div>
  <div id="bottom-nav-placeholder"></div>

  <script src="../../assets/js/mobile.js"></script>
  <script src="/assets/js/blog-post-detail.js"></script>
</body>
</html>
