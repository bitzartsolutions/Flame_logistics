<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Careers | Flame Logistics</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="/assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="bg-background text-on-surface font-body-md">
  <div id="header-placeholder"></div>
  <main class="pt-20 px-4 pb-20">
    <section class="rounded-3xl bg-primary p-6 text-white">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-white/70">Careers</p>
      <h1 class="mt-3 font-display-lg text-display-lg leading-tight">Join the Flame team</h1>
      <p class="mt-3 text-sm text-white/80">We are hiring across operations, customer success and transport planning.</p>
    </section>

    <section class="mt-6">
      <div id="jobs-list" class="space-y-4"></div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js"></script>
  <script>
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:4000/api'
      : 'https://flame-logistics-backend.vercel.app/api';

    async function loadJobs() {
      const container = document.getElementById('jobs-list');
      try {
        const response = await fetch(`${API_BASE}/careers`);
        if (!response.ok) throw new Error('Unable to load roles');
        const data = await response.json();
        const jobs = Array.isArray(data.items) ? data.items : [];
        if (!jobs.length) {
          container.innerHTML = '<div class="rounded-2xl border border-dashed border-gray-300 bg-white p-6 text-center text-gray-500">No openings are available right now.</div>';
          return;
        }
        container.innerHTML = jobs.map((job) => `
          <article class="rounded-3xl border border-outline-variant/40 bg-white p-5 shadow-sm">
            <h3 class="font-title-lg text-title-lg text-primary">${job.title}</h3>
            <p class="mt-1 text-sm font-semibold text-secondary">${job.department}</p>
            <p class="mt-3 text-sm text-on-surface-variant">${job.description || ''}</p>
          </article>
        `).join('');
      } catch (error) {
        container.innerHTML = '<div class="rounded-2xl border border-dashed border-gray-300 bg-white p-6 text-center text-gray-500">Unable to load careers data right now.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadJobs);
  </script>
</body>
</html>
