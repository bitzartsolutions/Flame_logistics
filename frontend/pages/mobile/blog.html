<script>
        // Simple Interaction: Navbar background opacity change on scroll
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 20) {
                nav.classList.add('bg-white');
                nav.classList.remove('bg-surface/90');
            } else {
                nav.classList.add('bg-surface/90');
                nav.classList.remove('bg-white');
            }
        });

        const BLOG_API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? 'http://localhost:4000'
          : '';
        const chips = document.querySelectorAll('#blogCategoryChips button');
        const feedContainer = document.getElementById('mobileBlogFeed');
        const blogCount = document.getElementById('mobileBlogCount');
        const searchInput = document.querySelector('input[placeholder="Search logistics insights..."]');
        const featuredImage = document.getElementById('featuredImage');
        const featuredTitle = document.getElementById('featuredTitle');
        const featuredExcerpt = document.getElementById('featuredExcerpt');
        const featuredBadge = document.getElementById('featuredBadge');
        let blogPosts = [];
        let activeCategory = 'all';

        function renderFeaturedSkeleton() {
            featuredImage.style.backgroundImage = 'none';
            featuredImage.classList.add('bg-surface-container', 'animate-pulse');
            featuredTitle.textContent = '';
            featuredExcerpt.textContent = '';
            featuredBadge.textContent = '';
        }

        function renderFeedSkeleton() {
            blogCount.textContent = '';
            feedContainer.innerHTML = Array.from({ length: 3 }).map(() => `
                <div class="flex flex-col gap-4 border-b border-outline-variant/20 pb-8 last:border-0">
                    <div class="h-56 w-full rounded-xl bg-surface-container animate-pulse"></div>
                    <div class="space-y-2">
                        <div class="h-3 w-32 rounded bg-surface-container animate-pulse"></div>
                        <div class="h-5 w-3/4 rounded bg-surface-container animate-pulse"></div>
                        <div class="h-4 w-full rounded bg-surface-container animate-pulse"></div>
                    </div>
                </div>
            `).join('');
        }

        renderFeaturedSkeleton();
        renderFeedSkeleton();

        function resolveFeaturedAndFeedPosts(items, featuredOverride = null) {
            const safeItems = Array.isArray(items) ? items.filter(Boolean) : [];
            if (!safeItems.length) {
                return { featured: null, feed: [] };
            }

            const featuredCandidate = featuredOverride || safeItems.find((post) => Boolean(post && post.featured)) || safeItems[0] || null;
            if (!featuredCandidate) {
                return { featured: null, feed: safeItems };
            }

            const featuredId = featuredCandidate.id !== undefined && featuredCandidate.id !== null ? Number(featuredCandidate.id) : null;
            const feed = safeItems.length > 1
                ? safeItems.filter((post) => {
                    const postId = post && post.id !== undefined && post.id !== null ? Number(post.id) : null;
                    return featuredId === null || postId !== featuredId;
                })
                : [];

            return { featured: featuredCandidate, feed };
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
        }

        function renderFeatured(post) {
            if (!post) {
                featuredImage.style.backgroundImage = 'none';
                featuredImage.classList.add('bg-surface-container');
                featuredTitle.textContent = 'No articles published yet';
                featuredExcerpt.textContent = 'Insights will appear here once content is added from the admin panel.';
                featuredBadge.textContent = 'Updates coming soon';
                return;
            }

            featuredImage.style.backgroundImage = `url('${post.imageUrl}')`;
            featuredImage.classList.remove('bg-surface-container');
            featuredTitle.textContent = post.title;
            featuredExcerpt.textContent = post.excerpt;
            featuredBadge.textContent = `${post.category} insight`;
        }

        function renderFeed(posts) {
            blogCount.textContent = `${posts.length} Articles`;

            if (!posts.length) {
                feedContainer.innerHTML = '';
                return;
            }

            feedContainer.innerHTML = posts.map(post => `
                <article class="flex flex-col gap-4 border-b border-outline-variant/20 pb-8 last:border-0 group">
                    <div class="relative h-56 w-full rounded-xl overflow-hidden">
                        <img class="w-full h-full object-cover group-hover:scale-105 transition-duration-500 transition-all" src="${post.imageUrl}" alt="${post.title}">
                        <div class="absolute top-3 left-3 bg-surface/90 backdrop-blur-md px-3 py-1 rounded-lg">
                            <span class="text-primary font-label-sm text-[10px] uppercase">${post.category}</span>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex items-center gap-3 text-on-surface-variant font-label-sm">
                            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">calendar_today</span> ${formatDate(post.date)}</span>
                            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">schedule</span> ${post.readTime}</span>
                        </div>
                        <h3 class="font-headline-md text-primary leading-tight group-hover:text-secondary transition-colors">${post.title}</h3>
                        <p class="text-on-surface-variant font-body-sm line-clamp-3">${post.excerpt}</p>
                        <a class="inline-flex items-center gap-1 text-secondary font-label-md mt-2 group-active:translate-x-1 transition-transform h-11" href="blog-post?id=${post.id}">
                            Read More <span class="material-symbols-outlined">arrow_forward</span>
                        </a>
                    </div>
                </article>
            `).join('');
        }

        function applyBlogFilters() {
            const query = (searchInput?.value || '').trim().toLowerCase();
            const filtered = blogPosts.filter(post => {
                const categoryMatch = activeCategory === 'all' || post.category === activeCategory;
                const queryMatch = !query || post.title.toLowerCase().includes(query) || post.excerpt.toLowerCase().includes(query);
                return categoryMatch && queryMatch;
            });
            renderFeed(filtered.slice(0, 5));
        }

        async function loadBlogPosts() {
            try {
                const response = await fetch(`${BLOG_API_BASE}/api/blog`);
                if (!response.ok) {
                    throw new Error('Failed to load blog posts');
                }
                const data = await response.json();
                const items = Array.isArray(data.items) ? data.items : [];
                const { featured, feed } = resolveFeaturedAndFeedPosts(items, data.featured || null);
                blogPosts = feed;
                renderFeatured(featured);
                applyBlogFilters();
            } catch (error) {
                feedContainer.innerHTML = '<p class="text-error">Unable to load blog posts from backend.</p>';
            }
        }

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => {
                    c.classList.remove('bg-secondary', 'text-white', 'shadow-md');
                    c.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                });
                chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                chip.classList.add('bg-secondary', 'text-white', 'shadow-md');
                activeCategory = chip.dataset.category || 'all';
                applyBlogFilters();
            });
        });

        if (searchInput) {
            searchInput.addEventListener('input', applyBlogFilters);
        }

        loadBlogPosts();
    </script>

    <!-- Mobile Header & Navigation Script -->
    <script src="../../assets/js/mobile.js"></script>
