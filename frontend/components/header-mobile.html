<!-- Mobile Header Component - Common for all pages -->
<!-- Top Navigation Bar -->
<nav class="fixed top-0 w-full h-[80px] bg-surface/90 backdrop-blur-xl z-50 border-b border-outline-variant/30 shadow-sm">
  <div class="flex justify-between items-center h-full px-margin-mobile">
    <a href="home.html" class="flex items-center">
      <img src="../../assets/images/flame-logo.png" alt="Flame Logistics" class="h-12 w-auto">
    </a>
    <button id="menu-toggle-btn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-surface-container active:scale-95 transition-transform" aria-label="Open menu">
      <span class="material-symbols-outlined text-trust-navy">menu</span>
    </button>
  </div>
</nav>

<!-- Mobile Navigation Drawer -->
<div id="mobile-nav-drawer" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" id="nav-overlay"></div>
  <nav class="absolute right-0 top-0 h-full w-[280px] bg-surface shadow-2xl transform translate-x-full transition-transform duration-300" id="nav-panel">
    <div class="p-6">
      <div class="flex justify-between items-center mb-8">
        <span class="font-headline-sm text-trust-navy font-bold">Menu</span>
        <button id="close-menu-btn" class="w-10 h-10 flex items-center justify-center text-trust-navy">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="space-y-2">
        <a href="home.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="home">Home</a>
        <a href="services.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="services">Services</a>
        <a href="industries.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="industries">Industries</a>
        <a href="gallery.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="gallery">Gallery</a>
        <a href="blog.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="blog">Blog</a>
        <a href="about.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="about">About Us</a>
        <a href="contact.html" class="mobile-nav-link block py-3 px-4 rounded-xl text-title-lg font-title-lg text-on-surface hover:bg-surface-container transition-colors" data-page="contact">Contact</a>
      </div>
      <div class="mt-8 pt-8 border-t border-outline-variant/30">
        <a href="contact.html" class="block w-full py-4 bg-flame-red text-white text-center rounded-xl font-title-lg active:scale-[0.98] transition-transform">Get a Quote</a>
      </div>
    </div>
  </nav>
</div>

<!-- Mobile Navigation Menu Script -->
<script>
(function() {
  const menuToggleBtn = document.getElementById('menu-toggle-btn');
  const closeMenuBtn = document.getElementById('close-menu-btn');
  const navDrawer = document.getElementById('mobile-nav-drawer');
  const navOverlay = document.getElementById('nav-overlay');
  const navPanel = document.getElementById('nav-panel');

  function openMenu() {
    navDrawer.classList.remove('hidden');
    setTimeout(() => {
      navPanel.style.transform = 'translateX(0)';
    }, 10);
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    navPanel.style.transform = 'translateX(100%)';
    setTimeout(() => {
      navDrawer.classList.add('hidden');
    }, 300);
    document.body.style.overflow = '';
  }

  if (menuToggleBtn) {
    menuToggleBtn.addEventListener('click', openMenu);
  }
  if (closeMenuBtn) {
    closeMenuBtn.addEventListener('click', closeMenu);
  }
  if (navOverlay) {
    navOverlay.addEventListener('click', closeMenu);
  }

  // Highlight current page in nav
  const currentPage = window.location.pathname.split('/').pop() || 'home.html';
  const navLinks = document.querySelectorAll('.mobile-nav-link');
  navLinks.forEach(link => {
    if (link.getAttribute('href') === currentPage) {
      link.classList.add('bg-surface-container', 'text-flame-red', 'font-bold');
    }
  });
})();
</script>
