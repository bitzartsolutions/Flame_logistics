<!-- Molecule: Testimonial Card -->
<!-- Usage: Customer testimonial/review display -->
<!-- Composed of: icon-material (stars), text, image (avatar), heading -->
<div class="molecule-testimonial-card p-8 bg-white rounded-2xl shadow-xl shadow-trust-navy/5 border border-outline-variant/30">
  <div class="molecule-testimonial-card__rating flex gap-1 text-flame-red mb-4">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">star</span>
  </div>
  <p class="molecule-testimonial-card__quote italic font-body-lg text-trust-navy mb-6">"Flame Logistics has redefined our regional distribution speed. Their local knowledge combined with global reach is exactly what we needed."</p>
  <div class="molecule-testimonial-card__author flex items-center gap-4">
    <div class="molecule-testimonial-card__avatar w-12 h-12 rounded-full bg-surface-container"></div>
    <div>
      <div class="molecule-testimonial-card__name font-title-lg text-trust-navy">Abdulaziz Al-Salem</div>
      <div class="molecule-testimonial-card__role font-label-md text-on-surface-variant">Operations Director, Energy Group</div>
    </div>
  </div>
</div>
