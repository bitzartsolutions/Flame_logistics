<!-- Organism: Stats Grid -->
<!-- Usage: 2x2 grid of statistics -->
<!-- Composed of: stat-card (molecule) x4 -->
<section class="organism-stats-grid py-12 bg-white px-margin-mobile">
  <div class="grid grid-cols-2 gap-4">
    <!-- Stat Card: Countries -->
    <div class="p-6 bg-surface-container-low rounded-xl border border-outline-variant/30">
      <span class="material-symbols-outlined text-trust-navy mb-4" style="font-variation-settings: 'FILL' 1;">public</span>
      <div class="font-headline-sm text-trust-navy">120+</div>
      <div class="font-label-md text-on-surface-variant uppercase opacity-70">Countries Reached</div>
    </div>
    
    <!-- Stat Card: Fleet -->
    <div class="p-6 bg-surface-container-low rounded-xl border border-outline-variant/30">
      <span class="material-symbols-outlined text-trust-navy mb-4" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
      <div class="font-headline-sm text-trust-navy">500+</div>
      <div class="font-label-md text-on-surface-variant uppercase opacity-70">Modern Fleet</div>
    </div>
    
    <!-- Stat Card: Delivery -->
    <div class="p-6 bg-surface-container-low rounded-xl border border-outline-variant/30">
      <span class="material-symbols-outlined text-trust-navy mb-4" style="font-variation-settings: 'FILL' 1;">verified</span>
      <div class="font-headline-sm text-trust-navy">99.9%</div>
      <div class="font-label-md text-on-surface-variant uppercase opacity-70">On-time Delivery</div>
    </div>
    
    <!-- Stat Card: Support -->
    <div class="p-6 bg-surface-container-low rounded-xl border border-outline-variant/30">
      <span class="material-symbols-outlined text-trust-navy mb-4" style="font-variation-settings: 'FILL' 1;">support_agent</span>
      <div class="font-headline-sm text-trust-navy">24/7</div>
      <div class="font-label-md text-on-surface-variant uppercase opacity-70">Expert Support</div>
    </div>
  </div>
</section>
