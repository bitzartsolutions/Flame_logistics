<!-- Organism: Hero Section -->
<!-- Usage: Full-screen hero with background image and CTAs -->
<!-- Composed of: image (background), label-badge, heading, button-primary, button-secondary -->
<section class="organism-hero relative pt-16 min-h-[85vh] flex flex-col justify-end overflow-hidden">
  <!-- Background Image -->
  <div class="organism-hero__bg absolute inset-0 z-0">
    <img class="w-full h-full object-cover" src="" alt="">
    <div class="absolute inset-0 hero-gradient"></div>
  </div>
  
  <!-- Content -->
  <div class="organism-hero__content relative z-10 px-margin-mobile pb-12 text-white">
    <!-- Badge -->
    <div class="organism-hero__badge inline-flex items-center gap-2 px-3 py-1 rounded-full bg-flame-red/20 border border-flame-red/30 backdrop-blur-md mb-4">
      <span class="w-2 h-2 rounded-full bg-flame-red animate-pulse"></span>
      <span class="text-label-md font-label-md tracking-widest uppercase">GCC Logistics Hub</span>
    </div>
    
    <!-- Title -->
    <h1 class="organism-hero__title font-display-lg-mobile text-display-lg-mobile mb-6">Connecting the GCC to the World</h1>
    
    <!-- CTA Buttons -->
    <div class="organism-hero__actions flex flex-col gap-3">
      <button class="w-full py-4 bg-flame-red text-white rounded-xl font-title-lg flex items-center justify-center gap-2 shadow-xl shadow-flame-red/20 active:scale-[0.98] transition-all">
        Track Your Shipment
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
      <button class="w-full py-4 bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-xl font-title-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
        Our Solutions
      </button>
    </div>
  </div>
</section>
