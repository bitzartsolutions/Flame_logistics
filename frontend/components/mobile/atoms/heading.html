<!-- Atom: Headings -->
<!-- Usage: Typography hierarchy for mobile -->

<!-- Display Large (Hero titles) -->
<h1 class="atom-heading atom-heading--display font-display-lg-mobile text-display-lg-mobile">
  Display Heading
</h1>

<!-- Headline Medium (Section titles) -->
<h2 class="atom-heading atom-heading--headline font-headline-md text-trust-navy">
  Headline Heading
</h2>

<!-- Headline Small (Subsection titles) -->
<h3 class="atom-heading atom-heading--headline-sm font-headline-sm text-trust-navy">
  Headline Small
</h3>

<!-- Title Large (Card titles) -->
<h4 class="atom-heading atom-heading--title font-title-lg text-trust-navy">
  Title Heading
</h4>
