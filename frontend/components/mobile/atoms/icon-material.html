<!-- Atom: Material Icon -->
<!-- Usage: Google Material Symbols icon wrapper -->
<!-- Variants: filled (FILL 1), outlined (FILL 0) -->
<span class="atom-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">
  icon_name
</span>

<!-- Filled variant -->
<span class="atom-icon atom-icon--filled material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">
  icon_name
</span>
