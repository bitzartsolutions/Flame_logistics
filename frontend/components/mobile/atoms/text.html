<!-- Atom: Text/Paragraph -->
<!-- Usage: Body text and descriptions -->

<!-- Body Large -->
<p class="atom-text atom-text--lg font-body-lg text-on-surface-variant">
  Body large text content
</p>

<!-- Body Medium (Default) -->
<p class="atom-text atom-text--md font-body-md text-on-surface-variant">
  Body medium text content
</p>

<!-- Label Medium -->
<span class="atom-text atom-text--label text-label-md font-label-md text-on-surface-variant uppercase tracking-widest">
  Label text
</span>
