<!-- Atom: Input Fields -->
<!-- Usage: Form inputs for contact/quote forms -->

<!-- Text Input -->
<div class="atom-input">
  <label class="atom-input__label font-label-md text-trust-navy block mb-2">Label</label>
  <input 
    type="text" 
    class="atom-input__field w-full px-4 py-3 border border-outline-variant rounded-xl focus:ring-2 focus:ring-flame-red focus:border-flame-red outline-none transition-all bg-white"
    placeholder="Placeholder text"
  >
</div>

<!-- Email Input -->
<div class="atom-input atom-input--email">
  <label class="atom-input__label font-label-md text-trust-navy block mb-2">Email</label>
  <input 
    type="email" 
    class="atom-input__field w-full px-4 py-3 border border-outline-variant rounded-xl focus:ring-2 focus:ring-flame-red focus:border-flame-red outline-none transition-all bg-white"
    placeholder="email@example.com"
  >
</div>

<!-- Select Input -->
<div class="atom-input atom-input--select">
  <label class="atom-input__label font-label-md text-trust-navy block mb-2">Select</label>
  <select class="atom-input__field w-full px-4 py-3 border border-outline-variant rounded-xl focus:ring-2 focus:ring-flame-red focus:border-flame-red outline-none transition-all bg-white">
    <option>Option 1</option>
    <option>Option 2</option>
  </select>
</div>
