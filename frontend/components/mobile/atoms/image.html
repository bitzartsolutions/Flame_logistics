<!-- Atom: Image -->
<!-- Usage: Responsive images with various aspect ratios -->

<!-- Square Image (Gallery) -->
<div class="atom-image atom-image--square aspect-square rounded-xl overflow-hidden">
  <img class="w-full h-full object-cover" src="" alt="">
</div>

<!-- Rectangular Image (Cards) -->
<div class="atom-image atom-image--rect w-24 h-24 flex-none rounded-xl overflow-hidden">
  <img class="w-full h-full object-cover" src="" alt="">
</div>

<!-- Full Cover Image (Hero/Backgrounds) -->
<div class="atom-image atom-image--cover absolute inset-0">
  <img class="w-full h-full object-cover" src="" alt="">
</div>

<!-- Avatar Image -->
<div class="atom-image atom-image--avatar w-12 h-12 rounded-full bg-surface-container overflow-hidden">
  <img class="w-full h-full object-cover" src="" alt="">
</div>
