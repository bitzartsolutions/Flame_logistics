<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flame Logistics - Redirecting...</title>
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #151719;
      color: #fff;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #bc000c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Loading Flame Logistics...</p>
  </div>
  
  <script>
    (function() {
      'use strict';
      
      const MOBILE_BREAKPOINT = 768;
      
      // Get page from URL query or default to home
      const urlParams = new URLSearchParams(window.location.search);
      let page = urlParams.get('page') || 'home';
      
      // Add .html extension if not present
      if (!page.endsWith('.html')) {
        page += '.html';
      }
      
      // Detect viewport
      const isMobile = window.innerWidth < MOBILE_BREAKPOINT;
      
      // Build redirect URL
      const basePath = isMobile ? '/pages/mobile/' : '/pages/desktop/';
      const redirectUrl = basePath + page;
      
      console.log('[Flame Logistics] Detected ' + (isMobile ? 'mobile' : 'desktop') + ' viewport');
      console.log('[Flame Logistics] Redirecting to: ' + redirectUrl);
      
      // Redirect immediately
      window.location.replace(redirectUrl);
    })();
  </script>
</body>
</html>
